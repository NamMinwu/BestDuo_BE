spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    show-sql: false
    properties:
      # SQL을 보기 좋게 포맷팅
      hibernate.format_sql: true
      # Hibernate 내부 통계(쿼리 수, flush, entity insert/delete 등) 활성화
      hibernate.generate_statistics: true
    hibernate:
      ddl-auto: update

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG
    com.bestduo_BE.SQL: DEBUG

external:
  riot:
    platform-base-url: https://kr.api.riotgames.com
    regional-base-url: https://asia.api.riotgames.com
    api-key: ${EXTERNAL_RIOT_API_KEY:}

patch-sync:
  enabled: ${PATCH_SYNC_ENABLED:true}
  interval-ms: ${PATCH_SYNC_INTERVAL_MS:21600000}  # 6시간

pipeline:
  runner:
    enabled: ${PIPELINE_RUNNER_ENABLED:true}
  seed-daily-budget: 2000
  collect-daily-budget: 8000
  collect-batch-size: 20
  ingest-batch-size: 10
  polling-interval-ms: 5000
  max-pages-per-division: 100
  tier-match-count:
    apex-tiers: 100
    diamond-emerald: 100
  stage3-priority-tier: ${PIPELINE_STAGE3_PRIORITY_TIER:DIAMOND}
  ingest:
    stale-minutes: 10
    error-cooldown-minutes: 10
    max-retry: 2

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

admin:
  api:
    key: ${ADMIN_API_KEY:}

monitoring:
  datasource:
    enabled: false

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: 0.0
  enable-tracing: false
  logging:
    minimum-event-level: warn
    minimum-breadcrumb-level: info
  ignored-exceptions-for-type:
    - com.bestduo_BE.common.infra.riot.exception.RiotRateLimitedException
