server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    show-sql: false
    properties:
      # SQL을 보기 좋게 포맷팅
      hibernate.format_sql: true
      # Hibernate 내부 통계(쿼리 수, flush, entity insert/delete 등) 활성화
      hibernate.generate_statistics: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG
    com.bestduo_BE.SQL: DEBUG
    com.bestduo_BE: ${LOGGING_LEVEL_COM_BESTDUO_BE:INFO}
    # HTTP wire-level 로거는 절대 DEBUG 이상 금지 — X-Riot-Token 헤더 유출 방지
    org.apache.hc: WARN
    org.apache.http: WARN
    jdk.internal.httpclient: WARN
    org.springframework.web.client.RestTemplate: INFO

external:
  riot:
    platform-base-url: https://kr.api.riotgames.com
    regional-base-url: https://asia.api.riotgames.com
    api-key: ${EXTERNAL_RIOT_API_KEY:}
    # personal/dev key 한도 (20/1s + 100/2min) 의 90% 시작. controlled experiment 로 95% 까지 안전 검증됨.
    # host 별 (kr.api, asia.api) 독립 적용. 운영 안정 확인 후 95% (19/95) 로 ramp.
    rate-limit:
      short-limit: ${EXTERNAL_RIOT_RATE_LIMIT_SHORT:18}
      short-window: ${EXTERNAL_RIOT_RATE_LIMIT_SHORT_WINDOW:1s}
      long-limit: ${EXTERNAL_RIOT_RATE_LIMIT_LONG:90}
      long-window: ${EXTERNAL_RIOT_RATE_LIMIT_LONG_WINDOW:2m}

patch-sync:
  enabled: ${PATCH_SYNC_ENABLED:false}
  interval-ms: ${PATCH_SYNC_INTERVAL_MS:21600000}  # 6시간

aggregate:
  scheduler:
    enabled: ${AGGREGATE_SCHEDULER_ENABLED:false}
    cron: ${AGGREGATE_SCHEDULER_CRON:0 0 4 * * *}  # 매일 04:00 Asia/Seoul
  retention:
    patches: ${AGGREGATE_RETENTION_PATCHES:3}  # 최근 N개 patch만 보존 (cron 끝에 자동 정리)

archive:
  r2:
    enabled: ${ARCHIVE_R2_ENABLED:false}
    endpoint: ${ARCHIVE_R2_ENDPOINT:}
    access-key-id: ${ARCHIVE_R2_ACCESS_KEY_ID:}
    secret-access-key: ${ARCHIVE_R2_SECRET_ACCESS_KEY:}
    bucket: ${ARCHIVE_R2_BUCKET:}

pipeline:
  runner:
    enabled: ${PIPELINE_RUNNER_ENABLED:false}
  collect-daily-budget: ${PIPELINE_COLLECT_DAILY_BUDGET:12000}
  collect-batch-size: ${PIPELINE_COLLECT_BATCH_SIZE:20}
  ingest-batch-size: ${PIPELINE_INGEST_BATCH_SIZE:10}
  polling-interval-ms: ${PIPELINE_POLLING_INTERVAL_MS:5000}
  max-pages-per-division: ${PIPELINE_MAX_PAGES_PER_DIVISION:100}
  dia-eme-daily-page-quota: ${PIPELINE_DIA_EME_DAILY_PAGE_QUOTA:1000}
  tier-match-count:
    apex-tiers: ${PIPELINE_TIER_APEX:100}
    diamond-emerald: ${PIPELINE_TIER_DIA_EME:100}
  ingest:
    stale-minutes: ${PIPELINE_INGEST_STALE_MINUTES:10}
    error-cooldown-minutes: ${PIPELINE_INGEST_ERROR_COOLDOWN_MINUTES:10}
    max-retry: ${PIPELINE_INGEST_MAX_RETRY:2}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  # 로컬 환경에서 Redis 미실행 시 health check 실패 로그를 막기 위해 임시 비활성화
  health:
    redis:
      enabled: false

admin:
  api:
    key: ${ADMIN_API_KEY:}

monitoring:
  datasource:
    enabled: false

nlp:
  base-url: ${NLP_BASE_URL:http://localhost:8001}
  timeout-ms: ${NLP_TIMEOUT_MS:8000}
  query-limit: ${NLP_QUERY_LIMIT:10}
  internal-api-key: ${NLP_INTERNAL_API_KEY:}
  chat:
    enabled: ${EXTERNAL_NLP_CHAT_ENABLED:false}
    rate-limit:
      requests-per-minute: ${CHAT_RATE_LIMIT_PER_MIN:10}

chat:
  session:
    max-turns: ${CHAT_SESSION_MAX_TURNS:12}
    ttl-seconds: ${CHAT_SESSION_TTL_SECONDS:1800}

resilience4j:
  circuitbreaker:
    instances:
      nlp:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      nlp:
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:bestduo-be@${RAILWAY_GIT_COMMIT_SHA:local}}
  send-default-pii: false
  traces-sample-rate: 0.0
  enable-tracing: false
  logging:
    minimum-event-level: warn
    minimum-breadcrumb-level: info
  ignored-exceptions-for-type:
    - com.bestduo_BE.common.infra.riot.exception.RiotRateLimitedException
