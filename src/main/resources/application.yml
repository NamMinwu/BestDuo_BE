server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    show-sql: false
    properties:
      # SQL을 보기 좋게 포맷팅
      hibernate.format_sql: true
      # Hibernate 내부 통계(쿼리 수, flush, entity insert/delete 등) 활성화
      hibernate.generate_statistics: true
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG
    com.bestduo_BE.SQL: DEBUG
    # HTTP wire-level 로거는 절대 DEBUG 이상 금지 — X-Riot-Token 헤더 유출 방지
    org.apache.hc: WARN
    org.apache.http: WARN
    jdk.internal.httpclient: WARN
    org.springframework.web.client.RestTemplate: INFO

external:
  riot:
    platform-base-url: https://kr.api.riotgames.com
    regional-base-url: https://asia.api.riotgames.com
    api-key: ${EXTERNAL_RIOT_API_KEY:}

patch-sync:
  enabled: ${PATCH_SYNC_ENABLED:true}
  interval-ms: ${PATCH_SYNC_INTERVAL_MS:21600000}  # 6시간

pipeline:
  runner:
    enabled: ${PIPELINE_RUNNER_ENABLED:true}
  seed-daily-budget: ${PIPELINE_SEED_DAILY_BUDGET:2000}
  collect-daily-budget: ${PIPELINE_COLLECT_DAILY_BUDGET:8000}
  collect-batch-size: ${PIPELINE_COLLECT_BATCH_SIZE:20}
  ingest-batch-size: ${PIPELINE_INGEST_BATCH_SIZE:10}
  polling-interval-ms: ${PIPELINE_POLLING_INTERVAL_MS:5000}
  max-pages-per-division: ${PIPELINE_MAX_PAGES_PER_DIVISION:100}
  tier-match-count:
    apex-tiers: ${PIPELINE_TIER_APEX:100}
    diamond-emerald: ${PIPELINE_TIER_DIA_EME:100}
  stage3-priority-tier: ${PIPELINE_STAGE3_PRIORITY_TIER:DIAMOND}
  ingest:
    stale-minutes: ${PIPELINE_INGEST_STALE_MINUTES:10}
    error-cooldown-minutes: ${PIPELINE_INGEST_ERROR_COOLDOWN_MINUTES:10}
    max-retry: ${PIPELINE_INGEST_MAX_RETRY:2}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

admin:
  api:
    key: ${ADMIN_API_KEY:}

monitoring:
  datasource:
    enabled: false

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:bestduo-be@${RAILWAY_GIT_COMMIT_SHA:local}}
  send-default-pii: false
  traces-sample-rate: 0.0
  enable-tracing: false
  logging:
    minimum-event-level: warn
    minimum-breadcrumb-level: info
  ignored-exceptions-for-type:
    - com.bestduo_BE.common.infra.riot.exception.RiotRateLimitedException
