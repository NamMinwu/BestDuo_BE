# Production profile - 활성화: SPRING_PROFILES_ACTIVE=prod
# Railway 배포 시 환경 변수로 프로파일 설정

server:
  forward-headers-strategy: framework  # Railway 프록시 X-Forwarded-* 헤더 인식

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:${DATABASE_URL:postgresql://localmaster:secret@localhost:5432/testdb}}
  jpa:
    show-sql: false
    properties:
      hibernate.format_sql: false
      hibernate.generate_statistics: false
      # 메모리·성능 최적화 (OOM 완화)
#      hibernate.jdbc.batch_size: 50
#      hibernate.order_inserts: true
#      hibernate.order_updates: true
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: INFO
    com.bestduo_BE: INFO
    com.bestduo_BE.SQL: WARN          # datasource-proxy / SqlExecutionLoggingListener 로깅 비활성화
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    # HTTP wire-level 로거는 절대 DEBUG 이상 금지 — X-Riot-Token 헤더 유출 방지
    org.apache.hc: WARN
    org.apache.http: WARN
    jdk.internal.httpclient: WARN
    org.springframework.web.client.RestTemplate: INFO

monitoring:
  datasource:
    enabled: false

sentry:
  environment: prod
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.05}
  enable-tracing: true
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: info
